name: ps1-ascii-guard
# Windows PowerShell 5.1 misreads BOM-less UTF-8 and the parser cascades into
# "MissingEndParenthesis" errors. Keep every shipped .ps1 ASCII-only so that can't happen.
on:
  push:
    paths: ['**/*.ps1']
  pull_request:
    paths: ['**/*.ps1']
jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any non-ASCII byte in a .ps1
        run: |
          bad=0
          while IFS= read -r f; do
            if LC_ALL=C grep -qP '[^\x00-\x7f]' "$f"; then
              echo "::error file=$f::non-ASCII byte(s) found - keep .ps1 ASCII-only (PS 5.1 misreads BOM-less UTF-8)"
              LC_ALL=C grep -nP '[^\x00-\x7f]' "$f" | head
              bad=1
            fi
          done < <(find . -name '*.ps1' -not -path './.git/*')
          if [ "$bad" -eq 0 ]; then echo "All .ps1 files are ASCII-only."; else exit 1; fi
