name: dhun

on:
  push:
    paths: ['dhun/skills/dhun/**', '.github/workflows/dhun.yml']
  pull_request:
    paths: ['dhun/skills/dhun/**', '.github/workflows/dhun.yml']
  workflow_dispatch:

# Audio playback itself is never asserted — CI runners have no sound device. What IS
# asserted is every failure mode that matters: scripts parse, settings.json merges
# without eating foreign hooks, install is idempotent, uninstall is clean, and the
# error hook fires on failures but stays silent on success.

jobs:
  posix:
    name: ${{ matrix.os }} (${{ matrix.json }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        json: [jq, python3]   # both JSON backends must produce identical results
    # DHUN_JSON pins the backend. Hiding jq is not viable: on macOS runners it lives
    # at /usr/bin/jq, on a read-only filesystem.
    env:
      DHUN_JSON: ${{ matrix.json }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the intended JSON backend is in use
        run: |
          echo "DHUN_JSON=$DHUN_JSON"
          if [ "$DHUN_JSON" = python3 ]; then
            command -v python3 >/dev/null || { echo "python3 missing"; exit 1; }
          else
            command -v jq >/dev/null || { echo "jq missing"; exit 1; }
          fi

      - name: Shell syntax
        run: |
          for f in dhun/skills/dhun/install.sh dhun/skills/dhun/hooks/*.sh; do sh -n "$f" && echo "ok  $f"; done

      - name: Player exits 0 with no audio backend present
        run: |
          chmod +x dhun/skills/dhun/hooks/*.sh
          ./dhun/skills/dhun/hooks/dhun-play.sh done 0.75
          echo "exit=$?  (must be 0 — a hook must never fail a tool call)"

      # DHUN_DRY_RUN short-circuits before the playback branch, so without this the
      # OS-detection and player-selection code would never run in CI. Shim the real
      # binary on PATH and assert it was invoked with the right file.
      - name: Audio backend is actually invoked with the right file
        run: |
          mkdir -p /tmp/shim
          case "$(uname -s)" in
            Darwin) BIN=afplay ;;
            *)      BIN=paplay ;;
          esac
          cat > "/tmp/shim/$BIN" <<'SHIM'
          #!/bin/sh
          echo "INVOKED $*" >> /tmp/invoked.log
          SHIM
          chmod +x "/tmp/shim/$BIN"
          : > /tmp/invoked.log

          PATH="/tmp/shim:$PATH" ./dhun/skills/dhun/hooks/dhun-play.sh permission 0.75

          grep -q "INVOKED" /tmp/invoked.log || {
            echo "player never invoked $BIN"; exit 1; }
          grep -q "permission.wav" /tmp/invoked.log || {
            echo "wrong file passed:"; cat /tmp/invoked.log; exit 1; }
          echo "backend invocation OK: $(cat /tmp/invoked.log)"

      # The praise hook is the only one that makes a decision, so it is the only one
      # that can be wrong in a way nobody notices until it fires on every message.
      - name: Praise detector fires and stays silent in the right places
        run: |
          chmod +x dhun/skills/dhun/hooks/*.sh
          fails=0
          check() {   # check <FIRE|SILENT> <text>
            : > /tmp/praise.log
            printf '%s' "$2" | DHUN_DRY_RUN=/tmp/praise.log \
              ./dhun/skills/dhun/hooks/dhun-praise.sh
            if grep -q "PLAYED praise" /tmp/praise.log; then got=FIRE; else got=SILENT; fi
            if [ "$got" != "$1" ]; then
              printf '  MISS want=%-6s got=%-6s | %s\n' "$1" "$got" "$2"; fails=$((fails+1))
            fi
          }

          # strong tier: unambiguous, fires anywhere in the message
          check FIRE   'thanks'
          check FIRE   'thank you'
          check FIRE   'great work'
          check FIRE   'well done'
          check FIRE   'shabash'
          check FIRE   'kya baat hai'
          check FIRE   "thanks! now add the praise sound to CI and bump the version too"
          # weak tier: only as a short leading reaction
          check FIRE   'perfect'
          check FIRE   'nice'
          check FIRE   'clean'
          check FIRE   'perfect, now do the windows installer'
          # hard negatives outrank the strong tier, because they are built from it
          check SILENT 'no thanks'
          check SILENT "thanks but that's wrong"
          check SILENT 'not great'
          check SILENT "it doesn't work"
          # instructions that happen to contain praise words
          check SILENT 'make it nicer'
          check SILENT 'make the header perfect and add a hover state on the nav items'
          check SILENT 'clean up the imports'
          check SILENT 'update the nice-dashboard project'
          check SILENT 'fix the chart legend'
          check SILENT 'is this good?'

          [ "$fails" -eq 0 ] || { echo "$fails praise mismatches"; exit 1; }
          echo "praise detector OK"

      # Regression guard for the bug that would have been invisible: the payload
      # carries cwd and transcript_path, so matching the raw JSON means a project
      # folder named "nice-dashboard" fires the sound on every single prompt.
      - name: Praise ignores everything outside the prompt field
        run: |
          : > /tmp/praise.log
          printf '%s' '{"session_id":"a1","cwd":"/Users/n/nice-awesome-ui","transcript_path":"/tmp/perfect.jsonl","hook_event_name":"UserPromptSubmit","prompt":"run the build"}' \
            | DHUN_DRY_RUN=/tmp/praise.log ./dhun/skills/dhun/hooks/dhun-praise.sh
          [ ! -s /tmp/praise.log ] || { echo "fired on cwd/transcript_path"; cat /tmp/praise.log; exit 1; }

          # ...while a real praise prompt in the same shape still fires.
          : > /tmp/praise.log
          printf '%s' '{"cwd":"/Users/n/plain","hook_event_name":"UserPromptSubmit","prompt":"thanks, that worked"}' \
            | DHUN_DRY_RUN=/tmp/praise.log ./dhun/skills/dhun/hooks/dhun-praise.sh
          grep -q "PLAYED praise" /tmp/praise.log || { echo "prompt field not read"; exit 1; }

          # A payload that lost its prompt field must go silent, not fall back to
          # matching the whole JSON blob.
          : > /tmp/praise.log
          printf '%s' '{"cwd":"/Users/n/great-work","hook_event_name":"UserPromptSubmit"}' \
            | DHUN_DRY_RUN=/tmp/praise.log ./dhun/skills/dhun/hooks/dhun-praise.sh
          [ ! -s /tmp/praise.log ] || { echo "fell back to raw payload"; exit 1; }
          echo "payload isolation OK"

      # UserPromptSubmit is the one event whose hook output is fed back into the model
      # as additionalContext. Anything on stdout becomes text in the conversation.
      - name: Praise hook never writes to stdout
        run: |
          for t in 'thanks' 'run the build' '' 'not json' '{"prompt":}'; do
            out=$(printf '%s' "$t" | ./dhun/skills/dhun/hooks/dhun-praise.sh 2>/dev/null)
            [ -z "$out" ] || { echo "stdout leak on [$t]: $out"; exit 1; }
          done
          echo "stdout clean OK"

      - name: Praise hook always exits 0
        run: |
          for t in 'thanks' '' 'garbage' '{"prompt":}' '{}'; do
            printf '%s' "$t" | ./dhun/skills/dhun/hooks/dhun-praise.sh >/dev/null 2>&1
            [ $? -eq 0 ] || { echo "non-zero exit on [$t]"; exit 1; }
          done
          echo "exit-0 OK"

      - name: Mute honours a timed pause and self-expires
        env:
          DHUN_DRY_RUN: /tmp/expiry.log
        run: |
          : > /tmp/expiry.log
          echo 1 > dhun/skills/dhun/muted            # epoch 1 = long past, so it must auto-clear
          ./dhun/skills/dhun/hooks/dhun-play.sh done 0.75
          [ -s /tmp/expiry.log ] || { echo "expired mute still suppressed playback"; exit 1; }
          [ ! -f dhun/skills/dhun/muted ] || { echo "expired mute file was not removed"; exit 1; }
          echo "timed-mute expiry OK"

      - name: Install
        run: |
          mkdir -p /tmp/cfg
          cat > /tmp/cfg/settings.json <<'JSON'
          {"theme":"dark","permissions":{"allow":["Bash(git push:*)"],"deny":[]},"hooks":{"Stop":[{"hooks":[{"type":"command","command":"echo FOREIGN"}]}]}}
          JSON
          ./dhun/skills/dhun/install.sh --dir /tmp/cfg

      - name: Assert merged config
        run: |
          python3 - <<'PY'
          import json
          cfg = json.load(open("/tmp/cfg/settings.json"))
          h = cfg["hooks"]
          assert cfg["theme"] == "dark", "unrelated keys must survive"
          got = [e.get("matcher") for e in h["Notification"]]
          want = ["agent_needs_input","idle_prompt"]
          assert got == want, f"matchers {got} != {want}"
          # PermissionRequest/Elicitation fire immediately; the Notification
          # equivalents lag by seconds, so they must NOT also be wired.
          assert h["PermissionRequest"], "PermissionRequest missing"
          assert h["Elicitation"], "Elicitation missing"
          for e in h["Notification"]:
              assert e.get("matcher") not in ("permission_prompt","elicitation_dialog"), \
                  f"duplicate laggy matcher wired: {e.get('matcher')}"
          cmds = [x["command"] for e in h["Stop"] for x in e["hooks"]]
          assert "echo FOREIGN" in cmds, "foreign hook was clobbered"
          assert any("dhun" in c for c in cmds), "dhun Stop hook missing"
          # PostToolUse fires on SUCCESS; failures need PostToolUseFailure.
          assert "PostToolUse" not in h, "must not wire PostToolUse - it never fires on failure"
          assert h["PostToolUseFailure"][0]["matcher"] == "*"
          assert "error" in h["PostToolUseFailure"][0]["hooks"][0]["command"]
          # UserPromptSubmit takes no matcher, and must not carry a trailing "&":
          # backgrounding detaches the hook from the stdin payload it has to read.
          ups = h["UserPromptSubmit"]
          assert len(ups) == 1, ups
          assert "matcher" not in ups[0], "UserPromptSubmit takes no matcher"
          cmd = ups[0]["hooks"][0]["command"]
          assert "dhun-praise" in cmd, cmd
          assert not cmd.rstrip().endswith("&"), f"must not background: {cmd}"
          print("merged config OK")
          PY

      - name: settings.json shape survives (arrays stay arrays)
        run: python3 tools/check_shape.py /tmp/cfg/settings.json

      - name: Assert idempotency
        run: |
          ./dhun/skills/dhun/install.sh --dir /tmp/cfg >/dev/null
          python3 -c "
          import json; h=json.load(open('/tmp/cfg/settings.json'))['hooks']
          assert len(h['Stop'])==2, f\"re-install duplicated entries: {len(h['Stop'])}\"
          assert len(h['Notification'])==2, len(h['Notification'])
          assert len(h['PermissionRequest'])==1, len(h['PermissionRequest'])
          assert len(h['Elicitation'])==1, len(h['Elicitation'])
          assert len(h['PostToolUseFailure'])==1, len(h['PostToolUseFailure'])
          assert len(h['UserPromptSubmit'])==1, len(h['UserPromptSubmit'])
          print('idempotent OK')"

      - name: Mute suppresses playback
        env:
          DHUN_DRY_RUN: /tmp/played.log
        run: |
          : > /tmp/played.log
          touch /tmp/cfg/dhun/muted.error
          /tmp/cfg/dhun/hooks/dhun-play.sh error 0.75
          [ ! -s /tmp/played.log ] || { echo "mute ignored"; cat /tmp/played.log; exit 1; }
          rm /tmp/cfg/dhun/muted.error
          /tmp/cfg/dhun/hooks/dhun-play.sh error 0.75
          grep -q "PLAYED error" /tmp/played.log || { echo "unmute failed"; exit 1; }
          echo "mute + unmute OK"

      - name: Uninstall leaves foreign hooks intact
        run: |
          ./dhun/skills/dhun/install.sh --dir /tmp/cfg --uninstall
          python3 - <<'PY'
          import json, os
          h = json.load(open("/tmp/cfg/settings.json"))["hooks"]
          assert h == {"Stop":[{"hooks":[{"type":"command","command":"echo FOREIGN"}]}]}, h
          assert not os.path.exists("/tmp/cfg/dhun"), "install dir not removed"
          print("uninstall OK")
          PY

  windows:
    name: windows-latest (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell = Windows PowerShell 5.1 (what teammates actually have)
        # pwsh       = PowerShell 7
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell parses
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("dhun/skills/dhun/install.ps1",
                           "dhun/skills/dhun/hooks/dhun-play.ps1",
                           "dhun/skills/dhun/hooks/dhun-praise.ps1")) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host $_ }; throw "parse failed: $f" }
            Write-Host "ok  $f"
          }

      # No sound device on a runner, so PlaySync() can't be asserted. Load() parses
      # the WAV header without touching hardware — it proves the file is a valid,
      # playable WAV and that SoundPlayer accepts it.
      - name: WAV files are valid and loadable by SoundPlayer
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($n in @("done","attention","permission","error","praise")) {
            $f = (Resolve-Path "dhun/skills/dhun/sounds/wav/$n.wav").Path

            # Header check works on any PowerShell, no assemblies required.
            $b = [System.IO.File]::ReadAllBytes($f)
            $riff = [System.Text.Encoding]::ASCII.GetString($b[0..3])
            $wave = [System.Text.Encoding]::ASCII.GetString($b[8..11])
            if ($riff -ne "RIFF" -or $wave -ne "WAVE") { throw "$n.wav is not a RIFF/WAVE file" }

            # SoundPlayer is built into .NET Framework (PS 5.1) but not always present
            # on PS 7. Assert when available, skip loudly when not.
            $sp = $null
            try { $sp = New-Object Media.SoundPlayer $f } catch { }
            if ($sp) { $sp.Load(); Write-Host "ok  $n.wav  RIFF/WAVE + SoundPlayer.Load()" }
            else     { Write-Host "ok  $n.wav  RIFF/WAVE (SoundPlayer unavailable here - skipped)" }
          }

      # Piping a string to a .ps1 from inside PowerShell feeds the pipeline, not stdin,
      # so ReadToEnd() would read nothing and every case would "pass" silently. The
      # hook has to be spawned as a real process -- which is how Claude Code runs it.
      - name: Praise detector decides correctly (spawned as a real process)
        env:
          DHUN_DRY_RUN: C:\praise.log
        run: |
          $ErrorActionPreference = "Stop"
          $hook = (Resolve-Path "dhun/skills/dhun/hooks/dhun-praise.ps1").Path
          $fails = 0
          function Check($want, $text) {
            Set-Content C:\praise.log -Value "" -NoNewline
            $text | & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $hook
            $log = Get-Content C:\praise.log -Raw
            $got = if ($log -and $log -match "PLAYED praise") { "FIRE" } else { "SILENT" }
            if ($got -ne $want) {
              Write-Host ("  MISS want={0,-6} got={1,-6} | {2}" -f $want, $got, $text)
              $script:fails++
            }
          }
          Check FIRE   'thanks'
          Check FIRE   'great work'
          Check FIRE   'shabash'
          Check FIRE   'perfect'
          Check FIRE   'perfect, now do the windows installer'
          Check SILENT 'no thanks'
          Check SILENT 'not great'
          Check SILENT 'make it nicer'
          Check SILENT 'update the nice-dashboard project'
          Check SILENT 'is this good?'
          Check SILENT '{"cwd":"/Users/n/nice-ui","hook_event_name":"UserPromptSubmit","prompt":"run the build"}'
          Check FIRE   '{"cwd":"/Users/n/plain","hook_event_name":"UserPromptSubmit","prompt":"thanks, that worked"}'
          if ($fails -gt 0) { throw "$fails praise mismatches" }
          Write-Host "praise detector OK"

      - name: Install
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path C:\cfg | Out-Null
          '{"theme":"dark","permissions":{"allow":["Bash(git push:*)"],"deny":[]},"hooks":{"Stop":[{"hooks":[{"type":"command","command":"echo FOREIGN"}]}]}}' |
            Set-Content C:\cfg\settings.json
          .\dhun\skills\dhun\install.ps1 -Dir C:\cfg

      # The PowerShell assertions below cannot see array-vs-object: member access
      # works either way, which is exactly how the v0.1.0 corruption shipped green.
      # Parse with something that cares.
      - name: settings.json shape survives (arrays stay arrays)
        shell: bash
        run: python tools/check_shape.py 'C:/cfg/settings.json'

      # Re-installing over a file an older dhun already flattened must REPAIR it,
      # not preserve the damage.
      - name: Re-install repairs a previously corrupted file
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path C:\broken | Out-Null
          '{"permissions":{"allow":["Bash(git push:*)"],"deny":[]},"hooks":{"Stop":[{"hooks":{"type":"command","command":"echo FOREIGN"}}]}}' |
            Set-Content C:\broken\settings.json
          .\dhun\skills\dhun\install.ps1 -Dir C:\broken | Out-Null

      - name: Repaired file has the right shape
        shell: bash
        run: python tools/check_shape.py 'C:/broken/settings.json'

      - name: Assert merged config
        run: |
          $ErrorActionPreference = "Stop"
          $h = (Get-Content C:\cfg\settings.json -Raw | ConvertFrom-Json).hooks
          $got  = @($h.Notification | ForEach-Object { $_.matcher })
          $want = @("agent_needs_input","idle_prompt")
          if ("$got" -ne "$want") { throw "matchers [$got] != [$want]" }
          $cmds = @($h.Stop | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          if ($cmds -notcontains "echo FOREIGN") { throw "foreign hook was clobbered" }
          if (-not ($cmds -match "dhun"))        { throw "dhun Stop hook missing" }
          if ($h.PSObject.Properties.Name -contains "PostToolUse") {
            throw "must not wire PostToolUse - it never fires on failure" }
          if (-not $h.PostToolUseFailure) { throw "PostToolUseFailure missing" }
          if (-not $h.PermissionRequest)   { throw "PermissionRequest missing" }
          if (-not $h.Elicitation)         { throw "Elicitation missing" }
          if (-not $h.UserPromptSubmit)    { throw "UserPromptSubmit missing" }
          $ups = @($h.UserPromptSubmit)[0].hooks[0].command
          if ($ups -notmatch "dhun-praise") { throw "praise hook not wired: $ups" }
          if ($ups.TrimEnd().EndsWith("&")) { throw "must not background: $ups" }
          Write-Host "merged config OK"

      - name: Assert idempotency
        run: |
          $ErrorActionPreference = "Stop"
          .\dhun\skills\dhun\install.ps1 -Dir C:\cfg | Out-Null
          $h = (Get-Content C:\cfg\settings.json -Raw | ConvertFrom-Json).hooks
          if (@($h.Stop).Count -ne 2)         { throw "re-install duplicated: $(@($h.Stop).Count)" }
          if (@($h.Notification).Count -ne 2)      { throw "notification count $(@($h.Notification).Count)" }
          if (@($h.PermissionRequest).Count -ne 1) { throw "PermissionRequest duplicated" }
          if (@($h.Elicitation).Count -ne 1)       { throw "Elicitation duplicated" }
          if (@($h.UserPromptSubmit).Count -ne 1)  { throw "UserPromptSubmit duplicated" }
          Write-Host "idempotent OK"

      - name: Mute suppresses playback
        env:
          DHUN_DRY_RUN: C:\played.log
        run: |
          $ErrorActionPreference = "Stop"
          Set-Content C:\played.log -Value ""
          New-Item -ItemType File -Force -Path C:\cfg\dhun\muted.error | Out-Null
          & C:\cfg\dhun\hooks\dhun-play.ps1 error 0.75
          if ((Get-Content C:\played.log | Where-Object { $_ -match "PLAYED" }).Count -ne 0) {
            throw "mute ignored" }
          Remove-Item C:\cfg\dhun\muted.error -Force
          & C:\cfg\dhun\hooks\dhun-play.ps1 error 0.75
          if (@(Get-Content C:\played.log | Where-Object { $_ -match "PLAYED error" }).Count -ne 1) {
            Get-Content C:\played.log; throw "unmute failed" }
          Write-Host "mute + unmute OK"

      - name: Uninstall leaves foreign hooks intact
        run: |
          $ErrorActionPreference = "Stop"
          .\dhun\skills\dhun\install.ps1 -Dir C:\cfg -Uninstall
          $h = (Get-Content C:\cfg\settings.json -Raw | ConvertFrom-Json).hooks
          $cmds = @($h.Stop | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          if ($cmds -notcontains "echo FOREIGN") { throw "foreign hook lost" }
          if ($cmds -match "dhun")               { throw "dhun hook survived uninstall" }
          if (Test-Path C:\cfg\dhun)             { throw "install dir not removed" }
          Write-Host "uninstall OK"
