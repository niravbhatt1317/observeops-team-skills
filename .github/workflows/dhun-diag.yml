name: dhun-diag
on: [push, workflow_dispatch]
jobs:
  diag:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Clean install then dump raw JSON
        shell: ${{ matrix.shell }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\clean | Out-Null
          '{}' | Set-Content C:\clean\settings.json
          .\dhun\skills\dhun\install.ps1 -Dir C:\clean | Out-Null
          Write-Host "===== RAW ====="
          Get-Content C:\clean\settings.json -Raw
      - name: Strict shape check
        shell: bash
        run: python .github/workflows/check_shape.py 'C:/clean/settings.json'
