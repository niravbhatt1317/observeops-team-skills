name: dhun-diag
on:
  push:
  workflow_dispatch:
jobs:
  ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean install (Windows PowerShell 5.1)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\clean | Out-Null
          Set-Content C:\clean\settings.json -Value "{}"
          .\dhun\skills\dhun\install.ps1 -Dir C:\clean | Out-Null
          Write-Host "===== RAW ====="
          Get-Content C:\clean\settings.json -Raw
      - name: Shape check
        shell: bash
        run: python tools/check_shape.py 'C:/clean/settings.json'
  ps7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean install (PowerShell 7)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\clean | Out-Null
          Set-Content C:\clean\settings.json -Value "{}"
          .\dhun\skills\dhun\install.ps1 -Dir C:\clean | Out-Null
          Write-Host "===== RAW ====="
          Get-Content C:\clean\settings.json -Raw
      - name: Shape check
        shell: bash
        run: python tools/check_shape.py 'C:/clean/settings.json'
